name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile $(find r3dproxy -name '*.py')

      - name: Headless smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from PySide6.QtWidgets import QApplication
          import r3dproxy.core.proxy_engine as pe
          pe.ProxyEngine.start = lambda self: None  # don't bind a socket in CI
          app = QApplication([])
          from r3dproxy.gui.main_window import AppContext, MainWindow
          win = MainWindow(AppContext())
          tabs = [win.tabs.tabText(i) for i in range(win.tabs.count())]
          expected = {"Proxy", "Target", "Repeater", "Intruder", "Scanner",
                      "Sequencer", "Issues", "Recon", "Tools", "OAST", "AI Assistant"}
          assert expected.issubset(set(tabs)), (expected - set(tabs), tabs)
          from r3dproxy.core.plugins import get_plugins
          assert len(get_plugins()) >= 10
          print("OK:", tabs, "| plugins:", len(get_plugins()))
          PY
