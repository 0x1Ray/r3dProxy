<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">🦅 r3dProxy</span>
    <span id="status" class="dot" title="API status"></span>
  </header>

  <div id="host" class="host">—</div>

  <div class="grid">
    <button data-act="scope">+ Scope</button>
    <button data-act="intercept" id="intercept">Intercept: ?</button>
    <button data-act="secrets">🔑 Secrets (page)</button>
    <button data-act="passive">🩺 Passive</button>
    <button data-act="subs">🌐 Subdomains</button>
    <button data-act="scan">🎯 Scan param ▾</button>
  </div>

  <div id="params" class="params hidden"></div>
  <div id="out" class="out">Open a page in scope, then pick an action.</div>

  <footer>
    <a href="#" id="opts">settings</a>
    <span class="muted">authorized testing only</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
